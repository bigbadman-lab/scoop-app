# Render — SCOOP Indexer Worker + News Ingest Cron

# Do NOT put secret values in this file — configure them in the Render dashboard.

services:
  - type: worker
    name: scoop-indexer
    runtime: docker
    plan: starter
    dockerfilePath: ./docker/indexer.Dockerfile
    dockerContext: .
    # Keep indexing OFF until migrations + HELLO verify pass (see docs/RENDER_INDEXER_CHECKLIST.md)
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SCOOP_CHAIN_ID
        value: "4663"
      - key: SCOOP_INDEXING_ENABLED
        value: "false"
      - key: SCOOP_START_BLOCK
        value: "55863290"
      - key: SCOOP_CONFIRM_MODE
        value: safe
      - key: SCOOP_NEW_WINDOW_SECONDS
        value: "604800"
      - key: SCOOP_SOON_THRESHOLD_BPS
        value: "8000"
      - key: SCOOP_REORG_WINDOW_BLOCKS
        value: "128"
      - key: SCOOP_QUOTE_SNAPSHOT_SECONDS
        value: "60"
      - key: SCOOP_QUOTE_USD_MAX_AGE_SECONDS
        value: "300"
      - key: SCOOP_POLL_INTERVAL_MS
        value: "2000"
      - key: SCOOP_MAX_BLOCK_BATCH
        value: "20"
      - key: SCOOP_LAUNCH_DUST_RAW
        value: "1000"
      - key: ROBINHOOD_FALLBACK_RPC_URL
        value: https://rpc.mainnet.chain.robinhood.com
      # Secrets — set in Render dashboard (never commit):
      # DATABASE_URL — session pooler (normal indexer traffic)
      # INDEXER_LOCK_DATABASE_URL — Supabase direct/non-pooled (singleton advisory lock only)
      # ROBINHOOD_RPC_URL
      # ROBINHOOD_WS_URL (optional)
      # SUPABASE_SERVICE_ROLE_KEY (optional; indexer prefers DATABASE_URL)
      - key: DATABASE_URL
        sync: false
      - key: INDEXER_LOCK_DATABASE_URL
        sync: false
      - key: INDEXER_LOCK_RETRY_MS
        value: "5000"
      - key: INDEXER_LOCK_WAIT_TIMEOUT_MS
        value: "120000"
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: ROBINHOOD_WS_URL
        sync: false

  # Phase D.2 — scheduled Stock News API ingest (equity universe + relevance filter + DB upsert)
  # Cadence: every 5 minutes UTC. Adjust if API quota requires a longer interval.
  # See docs/RENDER_NEWS_INGEST_CHECKLIST.md — do NOT activate until product asks.
  - type: cron
    name: scoop-news-ingest
    runtime: docker
    plan: starter
    schedule: "*/5 * * * *"
    dockerfilePath: ./docker/news.Dockerfile
    dockerContext: .
    dockerCommand: node dist/commands/ingest-once.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: STOCK_NEWS_ITEMS_PER_CALL
        value: "50"
      - key: STOCK_NEWS_BATCH_SIZE
        value: "8"
      - key: STOCK_NEWS_TOP_MENTION_DATE
        value: "today"
      - key: STOCK_NEWS_FALLBACK_DATE
        value: "last7days"
      - key: STOCK_NEWS_BACKFILL_LAG_SECONDS
        value: "21600"
      # Display gate is for the web app; worker only needs ingest secrets.
      - key: SCOOP_NEWS_PUBLIC_DISPLAY_ENABLED
        value: "false"
      # Secrets — set in Render dashboard (never commit):
      # DATABASE_URL
      # STOCK_NEWS_API_TOKEN
      - key: DATABASE_URL
        sync: false
      - key: STOCK_NEWS_API_TOKEN
        sync: false
